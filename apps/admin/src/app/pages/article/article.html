<p-toast></p-toast>
  <p-card header="Articles" subheader="Liste des articles" [style]="{width: '100%'}">
    <div class="p-grid">
      <div class="p-col-12">
        <p-toolbar>
          <ng-template #start>
            <form #searchForm="ngForm" (ngSubmit)="submitSearch()" >
              <p-inputgroup>
                <input
                  class="w-full"
                  pInputText
                  placeholder="Recherche par titre..."
                  name="q"
                  [(ngModel)]="searchQuery"
                />
                <p-inputgroup-addon>
                  <p-button icon="pi pi-search"
                  (click)="submitSearch()"
                  ariaLabel="Rechercher"
                  [text]="true"
                  severity="success"
                  variant="text" />
                </p-inputgroup-addon>
              </p-inputgroup>
            </form>
          </ng-template>

          <ng-template #end>
              <button (click)="onCreate()" pButton type="button"  icon="pi pi-plus" class="p-button-success capitalize">Nouvel article</button>
          </ng-template>


        </p-toolbar>

      </div>
    </div>
    <div class="p-grid p-mt-2">
      <div class="p-col-12">
        @if(articles().length>0){
        <p-table [value]="articles()" [paginator]="articles().length>0" [rows]="10" [rowsPerPageOptions]="[5,10,20]"
        stripedRows
        >
          <ng-template #header>
              <tr class="p-text-center capitalize">
                  <th>#</th>
                  <th>Titre</th>
                  <th>Rubrique</th>
                  <th>Date</th>
                  <th></th>
              </tr>
          </ng-template>
          <ng-template #body let-article let-i="rowIndex">
              <tr>
                  <td>{{ i+1 }}</td>
                  <td>{{ article?.titre }}</td>
                  <td>{{ article?.sousrubrique.sousrubrique }}</td>
                  <td>{{ article?.dateparution | date: 'dd MMM yyyy HH:mm:ss' }}</td>
                  <td>
                    <div class="flex">
                      <a [routerLink]="['/admin/article/show',article?.id]" class="text-green-700 hover:text-blue-700 mr-4" pTooltip="Mise à jour" tooltipPosition="top">
                        <i class="pi pi-pen-to-square"></i>
                      </a>
                     <a
                     tabindex=""
                     role="button"
                     (click)="onDelete(article.id)"
                     class="text-red-500 hover:text-red-700" pTooltip="Suppression" tooltipPosition="top">
                        <i class="pi pi-trash"></i>
                    </a>
                    </div>

                  </td>
              </tr>
          </ng-template>
        </p-table>
        }
      </div>
    </div>

  </p-card>
<p-confirmdialog />
